<!-- :root に --accent-color: #ef6c00; を定義し、.highlight に color: var(--accent-color); を
     指定してください。さらに .highlight:hover のときだけ font-weight: 700 になるようにします。
     書き換えると右側の表示がその場で変わります。 -->
<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <style>
      /* ここにCSSを書いてみましょう */
    </style>
  </head>
  <body>
    <p>ふつうの文章です。<span class="highlight">ここが強調されます</span>。</p>
    <p class="highlight">マウスを乗せると太字になります。</p>
  </body>
</html>
