<!-- .button-group に display: flex と gap: 8px を指定して、中のボタンが8px間隔で並ぶように
     してください。さらに .button-group 自体の padding を 16px にして、外枠との間にも余白を作ります。 -->
<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <style>
      /* 余白が見えるように、外枠だけ先に引いています */
      .button-group {
        border: 1px solid #999;
      }

      /* ここにCSSを書いてみましょう */
    </style>
  </head>
  <body>
    <div class="button-group">
      <button>保存</button>
      <button>キャンセル</button>
      <button>削除</button>
    </div>
  </body>
</html>
