<!-- .toolbar に display: flex を指定し、子要素が左右の両端に配置されるように
     justify-content を設定してください。さらに画面幅が600px以下になったら
     flex-direction: column に切り替わるよう @media を書いてください。
     (プレビューの幅を狭めると切り替わりを確認できます) -->
<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <style>
      .toolbar {
        border: 1px solid #999;
        padding: 12px;
      }

      /* ここにCSSを書いてみましょう */
    </style>
  </head>
  <body>
    <div class="toolbar">
      <span>ロゴ</span>
      <button>ログイン</button>
    </div>
  </body>
</html>
