<!-- bounce という @keyframes を作ってください。
     0% で transform: translateY(0)、50% で translateY(-10px)、100% で translateY(0)。
     その後 .icon に animation: bounce 500ms ease-in-out; を適用します。
     (何度も見たい場合は、animation の最後に infinite を付けると繰り返します) -->
<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <style>
      .icon {
        display: inline-block;
        font-size: 40px;
      }

      /* ここに @keyframes と .icon のanimationを書いてみましょう */
    </style>
  </head>
  <body>
    <span class="icon">🍰</span>
  </body>
</html>
