<!-- まずは .panel の並びだけを整えてみましょう(色や影は後回しでOK)。
     できたら background や border-radius を1つずつ足してみてください。

     ここは採点されません。何度でも書き換えて試せます。 -->
<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <style>
      body { background: #eef1f5; padding: 24px; }
      .card { background: #fff; padding: 12px; }

      /* ここに .panel を書いてみましょう */
    </style>
  </head>
  <body>
    <div class="panel">
      <div class="card">スコア</div>
      <div class="card">売上</div>
      <div class="card">お客さん</div>
    </div>
  </body>
</html>
