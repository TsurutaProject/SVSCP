<!-- .profile-card に「白い背景・角丸12px・薄い影・太字の文字」を指定するCSSを書いてください。
     影は box-shadow: 0 2px 6px rgba(0,0,0,0.1) 程度、文字は font-weight: 600 が目安です。 -->
<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <style>
      /* カードの見え方を確かめやすいように、背景だけ薄い色にしています */
      body {
        background: #eef1f5;
        padding: 24px;
        font-family: sans-serif;
      }

      /* ここにCSSを書いてみましょう */
    </style>
  </head>
  <body>
    <div class="profile-card">
      <p>のりまき</p>
      <p>ゲームが好きです</p>
    </div>
  </body>
</html>
